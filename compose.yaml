services:
  app:
    image: ${EDU_NARA_IMAGE:-edu-nara:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/edu-nara.db
      BODY_SIZE_LIMIT: 6M
      UPLOAD_DIR: /app/data/uploads
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-180}
    ports:
      - '${EDU_NARA_BIND_IP:-127.0.0.1}:3000:3000'
    volumes:
      - ${EDU_NARA_DATA_DIR:-./data}:/app/data
      - ${EDU_NARA_BACKUP_DIR:-./backups}:/app/backups
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
